[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valet-terminal"
version = "0.1.0"
description = "A premium, modern custom terminal and personal assistant."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Aaryan Pradhan"}
]
dependencies = [
    "textual>=0.52.0",
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "gitpython>=3.1.41",
    "groq",
    "requests"
]

[project.scripts]
valet = "valet.main:cli"
